<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 - anmol goyal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23111' stroke-width='3'/%3E%3C/svg%3E">
<style>
  /* same tokens as index.html: light only, whatever theme the viewer asks for */
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --muted: #6f6f6f;
    --underline: #bdbdbd;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }

  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: inherit; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  main { max-width: 24rem; }

  .code {
    font-family: var(--mono);
    font-size: 0.8em;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin: 0 0 0.9rem;
  }

  h1 {
    font-size: 1.2em;
    font-weight: 700;
    line-height: 1.35;
    margin: 0 0 0.4rem;
  }

  p { margin: 0 0 1.4rem; }

  /* links: same colour as the text, thin grey underline */
  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--underline);
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }

  a:hover { text-decoration-color: currentColor; }

  a:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    border-radius: 2px;
  }

  @media (max-width: 40rem) {
    body { font-size: 16px; padding: 2rem 1.25rem; }
  }
</style>
</head>
<body>

<main>
  <p class="code">status 404 &nbsp; link earth &rarr; mars &nbsp; signal lost</p>
  <h1>nothing here</h1>
  <p>this page doesn't exist, or it moved and i forgot to leave a forwarding address.</p>
  <a href="/">&larr; back home</a>
</main>

</body>
</html>
