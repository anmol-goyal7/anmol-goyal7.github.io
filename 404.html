<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — anmol goyal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23111' stroke-width='3'/%3E%3C/svg%3E">
<script>
  // runs before paint so a pinned theme doesn't flash the other one
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    color-scheme: light;
    --bg: #fff;
    --fg: #111;
    --muted: #6b6b6b;
    --faint: #767676;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e0e0e;
      --fg: #ededed;
      --muted: #9d9d9d;
      --faint: #8a8a8a;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0e0e;
    --fg: #ededed;
    --muted: #9d9d9d;
    --faint: #8a8a8a;
  }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--fg);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  main { max-width: 380px; }

  .code {
    font-family: ui-monospace, 'Cascadia Code', monospace;
    font-size: 0.74rem;
    color: var(--faint);
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  p {
    color: var(--muted);
    font-size: 0.92rem;
    margin-bottom: 22px;
  }

  a {
    color: var(--muted);
    font-size: 0.88rem;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
    text-underline-offset: 3px;
  }
</style>
</head>
<body>

<main>
  <p class="code">status 404 &nbsp; link earth &rarr; mars &nbsp; signal lost</p>
  <h1>nothing here</h1>
  <p>this page doesn't exist, or it moved and i forgot to leave a forwarding address.</p>
  <a href="/">&larr; back home</a>
</main>

</body>
</html>
